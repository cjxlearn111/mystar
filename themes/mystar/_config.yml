          - title: 艺奇游研社社长 | 湖北美术学院
            date: 2022.02 - 2023.03
            details:
              - "跨校活动策划：联合武汉大学、华中科技大学等 4 所高校社团，举办“融艺”跨学科交流会及校内首届 Game Jam 比赛（超 300 人参与）。"
              - "社团运营：优化社团分工与招新流程。任职期间社团核心成员规模增长 50%，共举办 3 场百人级社团活动。"

