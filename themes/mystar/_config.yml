            subtitle: 本科 · 影视动画学院（游戏互动方向）
            date: 2020.09 - 2024.07
            details:
              - "主修课程：用户体验与可用性设计，人工智能艺术，游戏策划，AIGC艺术设计，虚拟漫游与交互，三维模型与制作，空间设计基础，美学原理。"
      - id: internship
        title: 实习经历
        en: Internship
        items:
          - title: 腾讯 IEG · AI 3D 资产平台（在研 3DGS 产品）
            subtitle: 产品策划
            date: 2026.07 - 至今
            details:
              - "功能设计：跟进 3D 资产从上传、生成到编辑的全链路功能设计；独立负责“视角补全 + AI 补全”功能的方案、原型与落地，解决用户漏拍导致的模型残缺问题，缺陷率下降约 30%。"
              - "资产工作流设计：研究 3D 生成资产进入真实生产管线的可用边界，建立判断标准，规划资产功能方向。"
              - "竞品分析与视觉规范：调研 3D 生成、3D 编辑、程序化创作、3D 展示、资产管理类国内外竞品，输出功能对比分析与方向建议；制定产品视觉与美术规范，统一界面与素材标准，优化主页信息架构。"
          - title: 珞珈实验室（湖北）元梦 3D 元宇宙平台
            subtitle: 产品策划 / UIUX设计实习生
            date: 2025.08 - 2026.02
            details:
              - "交互流程优化：参与“手机拍照一键生成 3D 模型”功能迭代。提出 3 项交互简化方案，缩减操作步骤 20%，提升新手模型生成成功率。"
              - "竞品数据分析：深度拆解相关 3D 建模竞品，输出功能对比评估报告，为产品迭代方向提供数据支持。"
              - "美术资产规范：负责产品迭代期的美术资产把控，统一 UI 视觉风格，确保视觉元素符合平台设计规范。"
      - id: projects
        title: 项目经历
        en: Projects
        items:
          - title: 轻量化 3D 立体相册应用
            subtitle: 产品负责人 / UIUX设计（0-1 独立开发）
            date: 2025.03 - 2026.01
            link: https://my.feishu.cn/wiki/T9xvwEvSzizjm9ksYlwcKvvNn9g
            link_text: 产品实机演示 ↗
            details:
              - "项目介绍：一款打破传统 2D 空间局限，主打移动端流畅浏览的 3D 互动相册。"
              - "确立以 3DGS 技术为核心驱动。利用 AI 前端技术栈独立完成页面搭建与 UI 逻辑编写，进行产品原型验证到前端交互实现的全流程。"
              - "制定视觉交互规范，引入设计令牌（Design Tokens）与标准化组件（Components）确保视觉一致性。"
              - "打通从痛点洞察、UI/UX 设计到前端代码落地的全链路，实现产品从概念到可交付演示版本的转化。"
          - title: 《汪汪特工队》养成类游戏
            subtitle: 项目负责人 / 主策划
            date: 2024.01 - 2024.06
            link: https://share.weiyun.com/sV2LvcUk?weiyun_qr_code=1
            link_text: 演示视频 ↗
            details:
              - "项目介绍：一款融合“警犬题材”与“休闲养成”玩法的创新养成类游戏。"
              - "主导产品从 0 到 1 的研发周期，撰写完整系统设计文档与核心数值规划。统筹管理 8 人跨专业团队（程序、美术、策划），确保开发排期精准推进。"
              - "把控游戏美术风格与核心资源制作。参与引擎部署环节，统一整体视觉规范。"
              - "完成最终 Demo 的交付与验收，成功斩获未来制作人大奖赛（武汉站）“最佳人气奖”。"
