              - "MOBA 竞技：资深《英雄联盟》玩家，最高段位达到超凡大师，具备丰富的硬核实战经验。"
      - id: skills
        title: 相关技能
        en: Skills
        items:
          - details:
              - "产品原型设计：熟练使用 Figma、Axure 输出高保真原型，具备系统设计文档撰写与核心数值规划能力。"
              - "美术视觉设计：熟练使用 Photoshop、Illustrator、Blender 等工具进行 UI 视觉设计与 3D 资产制作。"
              - "前端技术：熟悉 HTML/CSS/JavaScript，掌握 AI 辅助编程代码落地。"
      - id: campus
        title: 校园经历
        en: Campus
